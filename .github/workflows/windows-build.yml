name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed only to attach the installer to a release on version tags

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No lockfile is committed yet; CI would otherwise default to --frozen-lockfile and fail.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate full icon set from app-icon.png
        run: pnpm tauri icon app-icon.png

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          # Lets the app know which build it is, so it can find newer releases.
          KOTHOK_BUILD: ${{ github.run_number }}

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run subtitle library tests
        run: node --experimental-strip-types tests/srt.test.mjs

      # Proves the FFmpeg download source used by Settings -> Tools still has the expected layout.
      - name: Verify FFmpeg download source
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest "$url.sha256" -OutFile ff.sha256
          Invoke-WebRequest $url -OutFile ff.zip
          $expected = ((Get-Content ff.sha256 -Raw).Trim() -split "\s+")[0].ToLower()
          $actual = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch: $expected vs $actual" }
          Expand-Archive ff.zip -DestinationPath ffx
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Where-Object { $_.FullName -like "*\bin\ffmpeg.exe" } | Select-Object -First 1
          if (-not $exe) { throw "bin/ffmpeg.exe not found" }
          & $exe.FullName -version | Select-Object -First 1
          # Round trip the same shrink command the app uses.
          & $exe.FullName -f lavfi -i "sine=frequency=440:duration=3" -y t.wav
          & $exe.FullName -y -i t.wav -vn -ac 1 -ar 16000 -b:a 32k t.mp3
          if (-not (Test-Path t.mp3)) { throw "ffmpeg conversion failed" }

      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -NoNewline -Path "$($_.FullName).sha256" -Value $h
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kothok-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Version tags (v*) publish a normal release; every other main build is
      # published as a pre-release so the .exe is always one click away on the Releases page.
      - name: Publish installer to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Kothok build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
